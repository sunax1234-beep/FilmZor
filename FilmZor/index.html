<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FilmZor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f0f12;
    --card: #17171c;
    --accent-a: #a855f7;
    --accent-b: #ec4899;
  }
  * { font-family: 'Poppins', system-ui, sans-serif; }
  body { background: var(--bg); }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a32; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a45; }

  .row-scroll { scrollbar-width: thin; scroll-behavior: smooth; }
  .row-scroll::-webkit-scrollbar { display: none; }

  .gradient-text {
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .nav-active {
    position: relative;
    color: #fff;
  }
  .nav-active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -10px;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
  }

  .pill {
    transition: all .2s ease;
  }
  .pill.active {
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 0 18px rgba(168,85,247,.45);
  }

  .movie-card {
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  }
  .movie-card:hover {
    transform: translateY(-6px) scale(1.06);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 10px 30px rgba(0,0,0,.6),
      0 0 40px rgba(168,85,247,.55),
      0 0 80px rgba(236,72,153,.25);
    z-index: 20;
  }
  .movie-card .play-overlay {
    opacity: 0;
    transform: scale(.7);
    transition: all .3s ease;
  }
  .movie-card:hover .play-overlay {
    opacity: 1;
    transform: scale(1);
  }
  .movie-card:hover .poster-shade {
    opacity: 1;
  }

  .row-arrow {
    opacity: 0;
    transition: opacity .2s ease, background .2s ease;
  }
  .row-wrap:hover .row-arrow { opacity: 1; }

  .glow-scrollbar-hide::-webkit-scrollbar { display: none; }

  select.styled-select {
    appearance: none;
    -webkit-appearance: none;
  }
</style>
</head>
<body class="min-h-screen text-gray-200 selection:bg-fuchsia-500/40">

  <!-- ===================== HEADER ===================== -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0f0f12]/85 border-b border-white/5">
    <div class="max-w-[1440px] mx-auto px-6 lg:px-10 h-20 flex items-center justify-between gap-6">

      <!-- Logo -->
      <a href="#" class="flex items-center gap-2 shrink-0">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" class="drop-shadow-[0_0_8px_rgba(168,85,247,.6)]">
          <path d="M8 5v14l11-7z" fill="url(#logoGrad)"/>
          <defs>
            <linearGradient id="logoGrad" x1="8" y1="5" x2="19" y2="19" gradientUnits="userSpaceOnUse">
              <stop stop-color="#a855f7"/>
              <stop offset="1" stop-color="#ec4899"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="text-2xl font-extrabold tracking-tight gradient-text">FilmZor</span>
      </a>

      <!-- Nav -->
      <nav class="hidden md:flex items-center gap-10 text-sm font-semibold tracking-wide text-gray-400 mx-auto">
        <a href="#" data-nav class="hover:text-white transition-colors">VÍTAJTE</a>
        <a href="#" data-nav class="nav-active hover:text-white transition-colors">FILMY</a>
        <a href="#" data-nav class="hover:text-white transition-colors">SERIÁLY</a>
      </nav>

      <!-- Search -->
      <div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-full pl-4 pr-1.5 py-1.5 focus-within:border-fuchsia-500/60 transition-colors">
        <input
          type="text"
          placeholder="Hľadať filmy, seriály..."
          class="bg-transparent outline-none text-sm placeholder:text-gray-500 w-32 md:w-48"
        />
        <button class="flex items-center gap-1.5 text-xs font-bold tracking-wider bg-gradient-to-r from-violet-500 to-pink-500 hover:brightness-110 text-white px-4 py-2 rounded-full transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          HĽADAŤ
        </button>
      </div>
    </div>
  </header>

  <!-- ===================== FILTER PANEL ===================== -->
  <section class="max-w-[1440px] mx-auto px-6 lg:px-10 py-6 flex flex-col gap-4 border-b border-white/5">

    <!-- Genre pills -->
    <div class="flex flex-wrap items-center gap-2.5">
      <span class="text-xs font-bold text-gray-500 tracking-widest mr-1">ŽÁNER</span>
      <div id="genrePills" class="flex flex-wrap gap-2">
        <button class="pill active px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300">Všetko</button>
        <button class="pill px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">Romantické</button>
        <button class="pill px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">Akčné</button>
        <button class="pill px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">Komédie</button>
        <button class="pill px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">Sci-Fi</button>
        <button class="pill px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">Horor</button>
        <button class="pill px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">Dráma</button>
        <button class="pill px-4 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">Animované</button>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4">
      <!-- Year pills -->
      <div class="flex flex-wrap items-center gap-2.5">
        <span class="text-xs font-bold text-gray-500 tracking-widest mr-1">ROK</span>
        <div id="yearPills" class="flex flex-wrap gap-2">
          <button class="pill active px-3.5 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300">Všetky</button>
          <button class="pill px-3.5 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">2024</button>
          <button class="pill px-3.5 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">2023</button>
          <button class="pill px-3.5 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">2022</button>
          <button class="pill px-3.5 py-1.5 rounded-full text-xs font-semibold border border-white/10 bg-white/5 text-gray-300 hover:border-fuchsia-400/50">2021</button>
        </div>
      </div>

      <!-- Sort dropdown -->
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-gray-500 tracking-widest">ZORADIŤ PODĽA</span>
        <div class="relative">
          <select class="styled-select bg-white/5 border border-white/10 text-gray-200 text-xs font-semibold rounded-full pl-4 pr-9 py-2 outline-none focus:border-fuchsia-500/60 cursor-pointer">
            <option>Najnovšie</option>
            <option>Najlepšie hodnotené</option>
            <option>Najobľúbenejšie</option>
            <option>Abecedne A-Z</option>
          </select>
          <svg class="w-3.5 h-3.5 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== CONTENT ===================== -->
  <main class="max-w-[1440px] mx-auto px-6 lg:px-10 py-10 flex flex-col gap-14">

    <!-- Row: Novinky -->
    <section>
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold tracking-wide">
          NOVINKY <span class="gradient-text">.</span>
        </h2>
      </div>
      <div class="row-wrap relative group">
        <button data-scroll="left" data-target="row-novinky" class="row-arrow absolute -left-3 top-0 bottom-8 z-30 w-10 my-auto flex items-center justify-center rounded-full bg-black/60 hover:bg-black/80 border border-white/10">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div id="row-novinky" class="row-scroll flex gap-5 overflow-x-auto pb-3 pt-2 px-1 scroll-px-1 snap-x"></div>
        <button data-scroll="right" data-target="row-novinky" class="row-arrow absolute -right-3 top-0 bottom-8 z-30 w-10 my-auto flex items-center justify-center rounded-full bg-black/60 hover:bg-black/80 border border-white/10">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </section>

    <!-- Row: Pokračovať v pozeraní -->
    <section>
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold tracking-wide">
          POKRAČOVAŤ V POZERANÍ <span class="gradient-text">.</span>
        </h2>
      </div>
      <div class="row-wrap relative group">
        <button data-scroll="left" data-target="row-continue" class="row-arrow absolute -left-3 top-0 bottom-8 z-30 w-10 my-auto flex items-center justify-center rounded-full bg-black/60 hover:bg-black/80 border border-white/10">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div id="row-continue" class="row-scroll flex gap-5 overflow-x-auto pb-3 pt-2 px-1 scroll-px-1 snap-x"></div>
        <button data-scroll="right" data-target="row-continue" class="row-arrow absolute -right-3 top-0 bottom-8 z-30 w-10 my-auto flex items-center justify-center rounded-full bg-black/60 hover:bg-black/80 border border-white/10">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </section>

  </main>

  <footer class="max-w-[1440px] mx-auto px-6 lg:px-10 py-10 text-center text-xs text-gray-600">
    &copy; 2026 FilmZor — demo UI, všetok obsah je fiktívny.
  </footer>

<script>
  // ---------- Fiktívne dáta ----------
  const genres = ["Romantické","Akčné","Komédie","Sci-Fi","Horor","Dráma","Animované"];
  const gradients = [
    "from-violet-700 via-fuchsia-600 to-pink-500",
    "from-indigo-800 via-purple-700 to-fuchsia-600",
    "from-fuchsia-700 via-pink-600 to-rose-500",
    "from-purple-800 via-violet-700 to-indigo-600",
    "from-pink-700 via-fuchsia-600 to-purple-600",
    "from-violet-800 via-indigo-700 to-blue-600",
  ];
  const titlesNew = [
    "Nočná Búrka","Posledný Let","Tieň Mesta","Strieborný Horizont","Ohnivá Cesta",
    "Zabudnutý Svet","Kód Nekonečna","Krídla Slobody","Temný Prístav","Hviezdny Prach"
  ];
  const titlesContinue = [
    "Mesačná Loď","Druhá Šanca","Rieka Snov","Posledný Strážca","Skleněné Mesto",
    "Vzdialená Signalizácia","Červená Aléja","Studená Stopa"
  ];

  function playIcon() {
    return `<svg class="w-6 h-6 text-white ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  }

  function createCard(title, withProgress) {
    const genre = genres[Math.floor(Math.random() * genres.length)];
    const year = 2021 + Math.floor(Math.random() * 4);
    const grad = gradients[Math.floor(Math.random() * gradients.length)];
    const progress = withProgress ? 15 + Math.floor(Math.random() * 75) : null;

    const card = document.createElement("div");
    card.className = "movie-card group shrink-0 w-44 md:w-52 snap-start cursor-pointer";
    card.innerHTML = `
      <div class="relative rounded-2xl overflow-hidden aspect-[2/3] bg-gradient-to-br ${grad} ring-1 ring-white/10">
        <div class="poster-shade absolute inset-0 bg-black/40 opacity-0 transition-opacity duration-300"></div>
        <div class="absolute inset-0 flex items-center justify-center text-center px-4">
          <span class="text-white/90 font-bold text-lg drop-shadow-lg leading-snug">${title}</span>
        </div>
        <div class="play-overlay absolute inset-0 flex items-center justify-center">
          <div class="w-14 h-14 rounded-full bg-white/15 backdrop-blur-md border border-white/30 flex items-center justify-center shadow-[0_0_25px_rgba(255,255,255,0.35)]">
            ${playIcon()}
          </div>
        </div>
        ${progress ? `
        <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-white/10">
          <div class="h-full bg-gradient-to-r from-violet-500 to-pink-500" style="width:${progress}%"></div>
        </div>` : ""}
      </div>
      <div class="mt-2.5 px-0.5">
        <p class="text-sm font-semibold text-gray-100 truncate">${title}</p>
        <p class="text-xs text-gray-500">${genre} • ${year}</p>
      </div>
    `;
    return card;
  }

  function fillRow(id, titles, withProgress) {
    const el = document.getElementById(id);
    titles.forEach(t => el.appendChild(createCard(t, withProgress)));
  }

  fillRow("row-novinky", titlesNew, false);
  fillRow("row-continue", titlesContinue, true);

  // ---------- Nav active state ----------
  document.querySelectorAll("[data-nav]").forEach(link => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      document.querySelectorAll("[data-nav]").forEach(l => l.classList.remove("nav-active"));
      link.classList.add("nav-active");
    });
  });

  // ---------- Genre / Year pill toggles ----------
  function setupPillGroup(containerId) {
    const container = document.getElementById(containerId);
    container.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        container.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
  }
  setupPillGroup("genrePills");
  setupPillGroup("yearPills");

  // ---------- Row scroll arrows ----------
  document.querySelectorAll("[data-scroll]").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = document.getElementById(btn.dataset.target);
      const amount = target.clientWidth * 0.8;
      target.scrollBy({ left: btn.dataset.scroll === "left" ? -amount : amount, behavior: "smooth" });
    });
  });
</script>

</body>
</html>
