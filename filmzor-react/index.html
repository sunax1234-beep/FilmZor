<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1.0 navyše k initial-scale: niektoré staršie Smart TV
         WebKit jadrá čiastočne ignorujú initial-scale samotné a zvolia si
         vlastnú "virtuálnu" (širšiu) šírku layoutu ako pri neresponzívnych
         desktop stránkach, čo sa prejaví ako appka väčšia než obrazovka a
         nutnosť posúvať sa do strán hneď po načítaní. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>FilmZor</title>

    <link rel="manifest" href="/app.webmanifest" />
    <meta name="theme-color" content="#0f0f12" />
    <!-- iOS Safari nečíta manifest.json pre "Pridať na plochu" vzhľad/ikonu — potrebuje vlastné tagy. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FilmZor" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
